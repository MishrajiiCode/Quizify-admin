<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quizify - Quiz Admin</title>
    <link rel="stylesheet" href="admin.css"> <!-- Reusing the same admin CSS -->
    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-firestore-compat.js"></script>
</head>
<body>
    <div class="admin-container">
        <h1>Quiz Content Management</h1>

        <!-- Login Section -->
        <div id="auth-section" class="auth-section">
            <h2>Admin Login</h2>
            <form id="login-form">
                <input type="password" id="admin-password" placeholder="Enter Admin Password">
                <button id="login-btn" type="submit">Login</button>
            </form>
            <p id="auth-error" class="error-message"></p>
        </div>

        <!-- Main Admin Panel -->
        <div id="admin-panel" style="display: none;">
            <div class="header">
                <h2>Quiz Editor</h2>
                <button id="logout-btn">Logout</button>
            </div>

            <!-- Navigation -->
            <div class="quiz-navigation">
                <div class="form-group">
                    <label for="category-select">Select Category:</label>
                    <select id="category-select" class="form-control">
                        <option value="competitive">Competitive</option>
                        <option value="academic">Academic</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="subject-select">Select Subject:</label>
                    <select id="subject-select" class="form-control"></select>
                </div>
                <div class="form-group">
                    <label for="chapter-select">Select Chapter/Class:</label>
                    <select id="chapter-select" class="form-control"></select>
                </div>
                <div class="form-group">
                    <label for="set-select">Select Set:</label>
                    <select id="set-select" class="form-control"></select>
                </div>
                <!-- Sample Paper Management (Academic only) -->
                <div id="sample-paper-section" class="form-group" style="display:none; margin-top:12px; border-top:1px solid #eee; padding-top:12px;">
                    <label for="sample-paper-stream-select">Stream (optional):</label>
                    <select id="sample-paper-stream-select" class="form-control" style="margin-bottom:8px;"></select>
                    <label for="sample-paper-url-input">Sample Paper URL (Image or PDF):</label>
                    <input type="url" id="sample-paper-url-input" class="form-control" placeholder="https://example.com/sample-paper.pdf">
                    <div style="margin-top:8px; display:flex; gap:8px;">
                        <button id="save-sample-paper-btn" class="admin-button">Save Sample Paper</button>
                        <button id="delete-sample-paper-btn" class="admin-button btn--danger">Delete Sample Paper</button>
                    </div>
                </div>
            </div>

            <hr>

            <!-- Question Editor -->
            <div id="question-editor-container">
                <h3 id="editor-heading">Please select a subject and chapter to begin.</h3>
                <div id="question-list">
                    <!-- Questions will be loaded here -->
                </div>
                <div id="set-actions" style="display: none; margin-top: 20px; border-top: 1px solid #eee; padding-top: 20px;">
                    <button id="add-question-btn" class="admin-button">Add New Question</button>
                    <button id="add-set-btn" class="admin-button btn--secondary">Add New Set</button>
                    <button id="delete-set-btn" class="admin-button btn--danger">Delete This Set</button>
                </div>
            </div>

            <p id="admin-status" class="status-message"></p>
        </div>
    </div>

    <!-- Question Edit/Add Modal -->
    <div id="question-modal" class="modal-overlay" style="align-items: flex-start; padding-top: 5vh;">
        <div class="modal-content">
            <div class="modal-header">
                <h2 id="question-modal-title">Edit Question</h2>
                <button id="close-question-modal-btn" class="modal-close-btn" title="Close">&times;</button>
            </div>
            <div class="modal-body">
                <form id="question-form">
                    <input type="hidden" id="question-id" value="-1">
                    <input type="hidden" id="question-set-index-input">
                    <div class="form-group">
                        <label for="question-text-input">Question:</label>
                        <textarea id="question-text-input" rows="3" required></textarea>
                    </div>
                    <div class="form-group">
                        <label for="question-image-url-input">Image URL (Optional):</label>
                        <input type="url" id="question-image-url-input" placeholder="https://example.com/image.png">
                    </div>
                    <div class="form-group">
                        <label>Options:</label>
                        <input type="text" id="option-0-input" placeholder="Option A" required>
                        <input type="text" id="option-1-input" placeholder="Option B" required>
                        <input type="text" id="option-2-input" placeholder="Option C" required>
                        <input type="text" id="option-3-input" placeholder="Option D" required>
                    </div>
                    <div class="form-group">
                        <label for="correct-answer-select">Correct Answer:</label>
                        <select id="correct-answer-select" required>
                            <option value="0">Option A</option>
                            <option value="1">Option B</option>
                            <option value="2">Option C</option>
                            <option value="3">Option D</option>
                        </select>
                    </div>
                </form>
            </div>
            <div class="modal-footer">
                <div class="modal-actions">
                    <button type="submit" form="question-form" id="save-question-btn" class="admin-button">Save Question</button>
                </div>
            </div>
        </div>
    </div>

    <!-- NEW: Add/Edit Name Modal (for Subjects/Topics) -->
    <div id="name-modal" class="modal-overlay">
        <div class="modal-content">
            <div class="modal-header">
                <h2 id="name-modal-title">Add New Subject</h2>
                <button id="close-name-modal-btn" class="modal-close-btn" title="Close">&times;</button>
            </div>
            <form id="name-form">
                <div class="form-group">
                    <label for="name-input">Name:</label>
                    <input type="text" id="name-input" required>
                </div>
                <button type="submit" id="save-name-btn">Save</button>
            </form>
        </div>
    </div>

    <!-- Load data files for migration -->
    <script src="classes.js"></script>
    <script src="quantitative.js"></script>
    <script src="english.js"></script>
    <script src="reasoning.js"></script>
    <script src="generalscience.js"></script>

    <script src="quiz-admin.js"></script>
</body>
</html>
